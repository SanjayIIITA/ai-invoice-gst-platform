spring.application.name=ai-invoice-gst-platform

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/invoice_db
spring.datasource.username=invoice_user
spring.datasource.password=invoice_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Storage
app.storage.upload-dir=uploads

# JWT
app.jwt.secret=ai-invoice-gst-platform-secret-key-must-be-at-least-32-chars
app.jwt.expiration-ms=86400000

# Spring AI — Groq (OpenAI compatible)
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.api-key=${GROQ_API_KEY:your-groq-api-key-here}

# Logging
logging.level.com.invoice.platform=DEBUG
